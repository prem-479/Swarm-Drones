[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uavx-resilient-swarm"
version = "0.1.0"
description = "UAV-X Resilient BVLOS Swarm simulation and autonomy framework"
requires-python = ">=3.13"
dependencies = [
    "numpy>=1.22",
    "PyYAML>=6.0",
    "scipy",
    "matplotlib",
    "pandas",
    "networkx",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
